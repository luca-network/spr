# Publishes @luca-network/spr, @luca-network/spr-sdk and @luca-network/spr-mcp to npm with npm Trusted
# Publishing: GitHub proves to npm that this workflow, in this repository, is running, so no npm token exists
# anywhere, and npm adds provenance to each version. Run it by hand: Actions → publish-npm → Run workflow.
# The "npm" environment asks for an approval. A package whose version is already on npm is left alone, so
# raise the version of each package you change.
name: publish-npm
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, registry-url: "https://registry.npmjs.org", package-manager-cache: false }
      # Trusted publishing needs npm 11.5.1 or later; the one that comes with Node may be older.
      - name: Up-to-date npm
        run: npm install -g npm@latest && node --version && npm --version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install "cryptography>=44"
      - run: npm ci
      - name: Test before publishing
        run: npm test
      # In order: the SDK needs the library, and the MCP server needs the SDK.
      - name: Publish
        run: |
          for p in spr spr-sdk spr-mcp; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm"
            else
              npm publish --workspace "packages/$p"
            fi
          done
