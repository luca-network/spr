# Publishes the Python SDK (python/) to PyPI as spr-sdk, with PyPI Trusted Publishing: GitHub proves to PyPI
# that this workflow, in this repository, is running, so no API token exists anywhere.
# Run it by hand: Actions → publish-python → Run workflow. The "pypi" environment can require an approval.
name: publish-python
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "cryptography>=42" build
      - name: Test before publishing
        run: python -m unittest discover -s tests
        working-directory: python
      - run: python -m build
        working-directory: python
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: python/dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
