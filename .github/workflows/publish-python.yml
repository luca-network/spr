# Publishes the Python SDK (python/) to PyPI as spr-sdk, with PyPI Trusted Publishing: GitHub proves to PyPI
# that this workflow, in this repository, is running, so no API token exists anywhere.
# Run it by hand: Actions → publish-python → Run workflow. The "pypi" environment asks for an approval.
name: publish-python
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install "cryptography>=44" build
      - name: Test before publishing
        run: python -m unittest discover -s tests
        working-directory: python
      - run: python -m build
        working-directory: python
      - name: The test vectors are inside the wheel
        run: python -m zipfile -l python/dist/*.whl | grep -q "spr/vectors.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: dist, path: python/dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
